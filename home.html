<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction System</title>
    

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0f172a;
            color: white;
        }

        nav {
            background-color: black;
            padding: 15px;
            text-align: left;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }



        .main {
            position: relative;
            width: 100%;
            min-height: 140vh;
            overflow: hidden;
        }

        .main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(45%);
            position: absolute;
        }



        .heading {
            position: relative;
            top: 70px;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .heading h1 {
            font-size: 42px;
            color: white;
            text-shadow: 2px 2px 10px black;
        }

        .heading p {
            margin-top: 10px;
            font-size: 18px;
            color: #e2e8f0;
        }



        .box {
            position: relative;
            top: 120px;
            margin: auto;
            width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 18px;
            z-index: 2;
            box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.5);
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 18px;
            outline: none;
            font-size: 15px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #38bdf8;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <nav>
        <a href="home.html">Home</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        
    </nav>

    <section class="main">

    

        <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200&auto=format&fit=crop"
            alt="House">

        
        <div class="heading">
            <h1>HOUSE PRICE PREDICTION USING MACHINE LEARNING</h1>
            <p>Enter the details below to predict house prices</p>
        </div>

        

        <div class="box">

            <form>



                <label for="floors">Floors</label>
                <select id="floors">
                    <option value="" disabled selected>
                        Select Floors
                    </option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>

                <label for="sqft">Sqft Living</label>
                <input type="number" id="sqft" placeholder="Enter sqft living area">

                <label for="bedrooms">Bedrooms</label>
                <select id="bedrooms">
                    <option value="" disabled selected>
                        Select Bedrooms
                    </option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>

                </select>

                <label for="bathrooms">Bathrooms</label>
                <select id="bathrooms">
                    <option value="" disabled selected>
                        Select Bathrooms
                    </option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>

                </select>
                <label for="location">Location</label>
                <select name="location">
                    <option value="" disabled selected>
                        Select Location
                    </option>
                    <option>Delhi</option>
                    <option>Noida</option>
                    <option>Gurgaon</option>
                </select>


                <button type="submit">Predict Price</button>

            </form>

        </div>

    </section>
   

<div id="result" style="
margin-top:20px;
padding:15px;
background:white;
color:black;
border-radius:10px;
text-align:center;
display:none;">
    <h3>Predicted House Price</h3>
    <p id="price"></p>
</div>
<form onsubmit="predict(event)"></form>
    <script>

        document.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();

            let floors = document.getElementById("floors").value;
            let sqft = document.getElementById("sqft").value;
            let bedrooms = document.getElementById("bedrooms").value;
            let bathrooms = document.getElementById("bathrooms").value;
            let location = document.querySelector("select[name='location']").value;

            if (!floors || !sqft || !bedrooms || !bathrooms || !location) {
                alert("Please fill all fields");
                return;
            }

            // Simple fake prediction logic
            let price = sqft * 2000 + (bedrooms * 50000) + (bathrooms * 30000);

            alert(
                "Prediction Done!\n\n" +
                "Location: " + location + "\n" +
                "Estimated Price: ₹ " + price
            );

        });
        

    </script>

<script src="script.js"></script>
</body>

</html>
